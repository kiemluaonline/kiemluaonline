name: Import Trạm Lúa source
on:
  push:
    paths:
      - "source-payload/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'kiemluaonline/kiemluaonline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified source
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03 04 05; do
            if [ ! -s "source-payload/${n}.b64" ]; then
              echo "Waiting for remaining source parts"
              exit 0
            fi
          done
          cat source-payload/{00,01,02,03,04,05}.b64 > /tmp/tram-lua.b64
          base64 --decode /tmp/tram-lua.b64 > /tmp/tram-lua.tar.xz
          echo "d506cfebc3f5c2537e8d0e75017ac3ac6a3d9270316e8304b779f39768a7f462  /tmp/tram-lua.tar.xz" | sha256sum --check
          tar -xJf /tmp/tram-lua.tar.xz
          cp -a tram-lua-website/. .
          rm -rf tram-lua-website source-payload
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Trạm Lúa source code"
          git push origin HEAD:main
