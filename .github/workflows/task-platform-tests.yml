name: Task platform checks
on:
  push:
    paths:
      - 'task-platform/**'
      - '.github/workflows/task-platform-tests.yml'
  pull_request:
    paths:
      - 'task-platform/**'
      - '.github/workflows/task-platform-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r task-platform/requirements.txt pytest
      - name: Compile source files
        run: python -m compileall -q task-platform
      - name: Run test suite
        run: python -m pytest -q task-platform/tests
