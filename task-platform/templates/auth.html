{% extends 'base.html' %}{% block content %}<section class="panel auth"><h1>{{ 'Đăng ký tài khoản' if register else 'Đăng nhập' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Tên đăng nhập<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Mật khẩu<input name="password" type="password" required minlength="{{ 10 if register else 1 }}" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button class="button">{{ 'Đăng ký' if register else 'Đăng nhập' }}</button></form><p>{% if register %}<a href="/login">Đã có tài khoản?</a>{% else %}<a href="/register">Tạo tài khoản mới</a>{% endif %}</p></section>{% endblock %}
