{% macro pages(data,endpoint,param,anchor='',extra={}) %}{% if data.pages > 1 %}<nav class="pager" aria-label="Phân trang"><span>Trang {{ data.page }}/{{ data.pages }} · {{ data.count }} kết quả</span><div>{% if data.page>1 %}<a class="button button-small button-subtle" href="{{ url_for(endpoint,**dict(extra,**{param:data.page-1})) }}{{ anchor }}">← Trước</a>{% endif %}{% if data.page<data.pages %}<a class="button button-small button-subtle" href="{{ url_for(endpoint,**dict(extra,**{param:data.page+1})) }}{{ anchor }}">Sau →</a>{% endif %}</div></nav>{% endif %}{% endmacro %}
